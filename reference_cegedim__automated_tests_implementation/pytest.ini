[pytest]
# Enable python logging during tests, at info level by default
log_cli = True
log_cli_level = INFO

# Default options for pytest to use each execution
addopts =
    --html=test-results/report.html
    --self-contained-html
    --json-report
    --json-report-file=test-results/results.json
    --json-report-omit=collectors

# Allows pytest to identify the base of this project as the pythonpath
pythonpath = .

# BDD feature file base directory (points to the shared consumer_tests folder)
bdd_features_base_dir = ../consumer_tests/

# These are the tags that pytest will recognise when using @pytest.mark
markers =
    access_record_html: Access Record HTML tests
    access_record_structured: Access Record Structured (Medications and Allergies) tests
    access_record_structured_extended: Access Record Structured (Full Record) tests
    send_document_consultation_summary: Send Document Consultation Summary tests
    send_document_online_consultation: Send Document Online Consultation tests
    spine_integration: Spine Integration tests
    foundations: Foundations tests
    access_document: Access Document tests
    structured_documents_migrate: Structured Documents Migrate tests
    general: General / cross-cutting tests
    error_handling: Error handling tests
    medications: Medication related tests
    allergies: Allergy related tests
    patient_demographics: Patient demographics tests
    investigations: Investigations tests
    referrals: Referrals tests
    diary_entries: Diary entries tests
    problems: Problems tests
    immunisations: Immunisations tests
    uncategorised_data: Uncategorised data tests
    consultations: Consultations tests
    linkages: Linkages tests
    search_queries: Pre-defined search query tests
