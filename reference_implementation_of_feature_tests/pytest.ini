[pytest]
# Enable python logging during tests, at info level by default
log_cli = True
log_cli_level = INFO

# Default options for pytest to use each execution
addopts =
    --html=test-results/report.html
    --self-contained-html
    --json-report
    --json-report-file=test-results/results.json
    --json-report-omit=collectors

# Allows pytest to identify the base of this project as the pythonpath
pythonpath = .

# BDD feature file base directory (points to the shared consumer_tests folder)
bdd_features_base_dir = ../consumer_tests/

# These are the tags that pytest will recognise when using @pytest.mark
markers =
    access_record_structured: Access Record Structured (Medications and Allergies) tests
    access_record_structured_extended: Access Record Structured (Full Record) tests
    allergies: Allergy related tests
    consultations: Consultation related tests
    data_sharing: Data sharing tests
    date_filters: Date filter tests
    deceased: Deceased patient tests
    diary_entries: Diary entry tests
    dissent: Dissent to share tests
    encounters: Encounter related tests
    error_handling: Error handling tests
    immunisations: Immunisation related tests
    inactive: Inactive patient tests
    investigations: Investigation related tests
    linkages: Linkages tests
    medications: Medication related tests
    observations: Observation related tests
    problems: Problem related tests
    referrals: Referral related tests
    search_queries: Pre-defined search query tests
    skip_audit_logs_unavailable: Temporarily skip scenarios where required audit logs are inaccessible in this environment
    skip_cededim_did_not_implement_so_out_of_scope: Temporarily skip scenarios Cededim did not implement and are out of scope
    skip_sensitive_pds_data_unavailable: Temporarily skip scenarios where required sensitive/s-flag PDS data is unavailable
    sensitive: Sensitive patient tests
    summary: Summary tests
    superseded: Superseded NHS number tests
    ui_display: UI display tests
    uncategorised_data: Uncategorised data tests
    warnings: Warning tests
